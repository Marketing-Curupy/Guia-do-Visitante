<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingressos Curupy</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container">
    <header class="hero">
      <h1>Ingressos Curupy Acqua Park</h1>
      <p>Escolha a data da visita para consultar os valores online.</p>
    </header>

    <section class="calendar-card">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)">‹</button>
        <h2 id="monthTitle"></h2>
        <button onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekdays">
        <span>Dom</span>
        <span>Seg</span>
        <span>Ter</span>
        <span>Qua</span>
        <span>Qui</span>
        <span>Sex</span>
        <span>Sáb</span>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </main>

  <div id="dateModal" class="modal">
    <div class="modal-content">
      <button class="close" onclick="closeModal()">×</button>

      <h2 id="modalDate"></h2>

      <div id="closedMessage" class="closed-message">
        <strong id="closedTitle"></strong>
        <p id="closedText"></p>
        <p id="nextOpenDate"></p>
      </div>

      <div id="openContent">
        <div id="ticketsList"></div>

        <button id="chooseBtn">
          ESCOLHER INGRESSOS PARA ESTA DATA
        </button>

        <p class="redirect-text">
          Você será direcionado para o Só Falta Eu para concluir sua compra.
        </p>
      </div>
    </div>
  </div>

  <script src="script.js?v=12"></script>
</body>
</html>
